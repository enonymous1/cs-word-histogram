name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build WordHistogram.sln --configuration Release
      - name: Test
        run: dotnet test WordHistogram.sln --configuration Release --no-build
      - name: Check formatting
        run: dotnet format WordHistogram.sln --verify-no-changes
